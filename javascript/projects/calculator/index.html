<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./dist/style.css">
	<title>JS</title>
</head>
<body class="min-h-screen flex justify-center items-center">
	
	<div class="p-5 bg-gray-100 rounded-xl">
		<div class="mx-auto max-w-xs">
			<input id="input" type="text" class="disabled:text-black! disabled:opacity-100! text-2xl block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-400 focus:ring focus:ring-primary-200 focus:ring-opacity-50 disabled:cursor-not-allowed disabled:bg-gray-50 text-end px-5 py-2" disabled />
		</div>
		<div class="grid grid-cols-4 gap-2 mt-5 text-center">
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-clear">C</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">(</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">)</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">/</div>

			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">7</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">8</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">9</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">*</div>

			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">4</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">5</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">6</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">+</div>

			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">1</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">2</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">3</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">-</div>

			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">.</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-value">0</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-erase">←</div>
			<div class="px-5 py-4 bg-white rounded-xl cursor-pointer hover:bg-gray-200 btn-result">=</div>
		</div>
	</div>

	
	<script src="./src/script.js"></script>
</body>
</html>
